    texto: "Antes de la Fase de Acción, puedes descartar 1 carta para elegir 1 de las 3 primeras. Socios de información: Curioso mira 4 y Cotilla no descarta."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
