nombre: "Reglamento"
slug: "reglamento"
cartas:
  - pagina: 1
    tipo: "encabezado"
    titulo: "Introducción"
    columnas: 2
    texto: "En ¡Ese gato es mío!, todos los vecinos del barrio sois unos auténticos esnobs y locos de los gatos. Ya tenéis muchos gastos en casa, pero todavía no os habéis puesto de acuerdo sobre quién tiene los mejores mininos.\n\nLa llegada de nuevos mininos callejeros desata una guerra de postureo, travesuras y robos de gatos. Tendrás que acomodar a tus favoritos en el Sofá, aprovechar sus habilidades y fastidiar los planes de tus vecinos hasta demostrar quién tiene la colonia de gatos más prestigiosa.\n\nLos puntos de prestigio representan la reputación de tu colonia en el barrio. Los gatos aportan puntos según estén en el Sofá o en el Salón. Sus habilidades, las sinergias y algunas cartas pueden aumentar esos puntos."
  - pagina: 1
    tipo: "seccion"
    titulo: "Objetivo"
    texto: "Gana quien alcance su objetivo durante su propio turno, una vez resuelto el efecto en curso y sus respuestas. Si ya lo cumples al empezar, resuelve primero los efectos de inicio. Llegar a la cifra durante el turno de otra persona no da la victoria."
  - pagina: 1
    tipo: "lista"
    grupo: "prestigio"
    titulo: "Prestigio necesario"
    texto: "2 jugadores: 15 puntos."
  - pagina: 1
    tipo: "lista"
    grupo: "prestigio"
    texto: "3 o 4 jugadores: 13 puntos."
  - pagina: 1
    tipo: "lista"
    grupo: "prestigio"
    texto: "5 jugadores: 12 puntos."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    titulo: "Preparación"
    ordenada: true
    texto: "Baraja el mazo y reparte 4 cartas a cada jugador."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    ordenada: true
    texto: "Si recibes 3 o más gatos, devuelve las 4 cartas, baraja y repite el reparto."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    ordenada: true
    texto: "Coloca tus gatos en el Sofá si caben o en el Salón; las demás cartas forman tu mano."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    ordenada: true
    texto: "Empieza quien tenga menos gatos. En caso de empate, quien obtuvo menos puntos en la partida anterior; si persiste o no hay registro, decididlo al azar."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    ordenada: true
    texto: "Los turnos continúan en sentido horario."
  - pagina: 1
    tipo: "seccion"
    titulo: "Tu casa"
    texto: "El Sofá tiene 3 espacios y activa las habilidades que no indiquen otra zona. El Salón no tiene límite y sus gatos también cuentan para el prestigio. El Gordo cuenta como un gato, pero ocupa 2 espacios del Sofá. Cuando recibas un gato, eliges dónde colocarlo si cabe; puedes reordenar gatos dentro de una zona sin que cuente como movimiento."
  - pagina: 2
    tipo: "encabezado"
    titulo: "El turno"
    columnas: 2
    texto: "Izquierda: turno básico; derecha: paso a paso. Colores: inicio (azul), robo (morado), acción (ocre), movimiento (verde), cierre (gris), habilidades (turquesa) y alternativas (rojo)."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "basico"
    titulo_grupo: "Turno básico"
    numero: "1"
    fase: "inicio"
    marca: "fase"
    titulo: "Inicio del turno"
    texto: "Resuelve los efectos de inicio y comprueba si ganas."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "basico"
    titulo_grupo: "Turno básico"
    numero: "2.1"
    fase: "robo"
    marca: "fase"
    titulo: "Robo inicial"
    texto: "Roba 1 carta."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "basico"
    titulo_grupo: "Turno básico"
    numero: "2.2"
    fase: "robo"
    marca: "fase"
    titulo: "Reposición"
    texto: "Si después del robo inicial tienes menos de 3 cartas en la mano, roba hasta tener 3."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "basico"
    titulo_grupo: "Turno básico"
    numero: "3"
    fase: "accion"
    marca: "fase"
    titulo: "Fase de Acción · puedes pasar"
    texto: "Tienes 1 acción: juega 1 carta, declara 1 ataque o pasa. Usa aquí las acciones extra."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "basico"
    titulo_grupo: "Turno básico"
    numero: "4"
    fase: "movimiento"
    marca: "fase"
    titulo: "Movimiento gatuno · opcional"
    texto: "Si quieres, mueve 1 gato entre el Sofá y el Salón."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "basico"
    titulo_grupo: "Turno básico"
    numero: "5"
    fase: "cierre"
    marca: "fase"
    titulo: "Cierre del turno"
    texto: "Descarta hasta quedarte con 7 cartas. Pierdes las acciones no usadas."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "basico"
    titulo_grupo: "Turno básico"
    numero: "6"
    fase: "cierre"
    marca: "fase"
    titulo: "Siguiente jugador"
    texto: "El turno continúa en sentido horario."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "1"
    fase: "inicio"
    marca: "fase"
    titulo: "Inicio del turno"
    texto: "Caducan Cama, Siesta o Huelga que deban terminar ahora. Resuelve Ronroneo solo si sus gatos siguen en el Sofá."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "2.1"
    fase: "robo"
    marca: "fase"
    titulo: "Robo inicial"
    alternativa: "robo-inicial"
    texto: "Roba 1; +1 si el Bebé está solo en el Sofá y +1 con Comedero. Se suman."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "2.1"
    fase: "robo"
    marca: "opcional"
    titulo: "Mapache · opcional"
    alternativa: "robo-inicial"
    texto: "En vez del robo inicial y sus bonificaciones, recupera la carta superior del descarte común."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "2.2"
    fase: "robo"
    marca: "fase"
    titulo: "Reposición por mano baja"
    texto: "Con menos de 3 cartas tras el robo, repón hasta 3. Previsor: hasta 4; Control de inventario: hasta 5."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "2.3"
    fase: "robo"
    marca: "intermedio"
    titulo: "Curioso · opcional"
    texto: "Puedes descartar 1 carta para elegir 1 de las 3 primeras. Socios de información: Curioso mira 4 y Cotilla no descarta."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "2.4"
    fase: "robo"
    marca: "intermedio"
    titulo: "Trillizos · opcional"
    texto: "Una vez por turno, descarta y roba tantas cartas como Trillizos haya en el Sofá; paga todo el descarte."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "2.5"
    fase: "accion"
    marca: "intermedio"
    titulo: "Hiperactivo · opcional"
    texto: "Antes de actuar, puedes mover 1 gato adicional."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "2.6"
    fase: "accion"
    marca: "intermedio"
    titulo: "Rascador · cuando ataques"
    texto: "Una vez por turno, al atacar, puedes descartar 1 carta para sumar +1 de potencia. Decide antes de la defensa."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "3"
    fase: "accion"
    marca: "fase"
    alternativa: "fase-accion"
    titulo: "Fase de Acción · puedes pasar"
    texto: "1 acción principal: juega 1 carta, declara 1 ataque o pasa. Puedes pasar extras; resuelve efectos y respuestas y comprueba la victoria."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "3.1"
    fase: "accion"
    marca: "opcional"
    alternativa: "fase-accion"
    titulo: "Gordo · si pasas"
    texto: "Si está en el Sofá y pasas toda la Fase de Acción, mira en secreto la carta superior; déjala arriba o al fondo."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "4"
    fase: "movimiento"
    marca: "fase"
    titulo: "Movimiento gatuno · opcional"
    texto: "Puedes mover 1 gato entre Sofá y Salón; no es intercambio. Huelga lo impide."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "4.1"
    fase: "cierre"
    marca: "intermedio"
    titulo: "Antes del cierre · Arenero"
    texto: "Con 3 o más cartas en el Arenero, puedes recuperar 1 antes del cierre y descartar el resto."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "5"
    fase: "cierre"
    marca: "fase"
    titulo: "Cierre del turno"
    texto: "Descarta hasta tu límite: 7 cartas, o 9 con Acaparadora. Caducan los efectos del turno."
  - pagina: 3
    tipo: "encabezado"
    titulo: "Combate y acciones"
    columnas: 2
    texto: "Atacar cuesta 1 acción principal. El objetivo puede ser un gato o una estructura atacable."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    titulo: "Resolución del combate"
    ordenada: true
    ancho: "completo"
    texto: "El atacante declara el objetivo y elige boca abajo su Ataque y los Apoyos que quiera."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    ordenada: true
    texto: "Quien recibe el ataque puede usar Ratón con Hierba Gatuna para desviarlo a otro objetivo válido, respetando las protecciones. Se permiten desvíos sucesivos; la Cama no puede elegirse."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    ordenada: true
    texto: "Antes de elegir defensa, Espía revela el Ataque y sus Apoyos a la mesa, sin acción ni descarte. Cotilla puede revelar lo mismo si descarta 1 carta."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    ordenada: true
    texto: "El propietario del objetivo final decide si defiende con una carta de Ataque y puede añadir tantos Apoyos como quiera."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    ordenada: true
    texto: "Revelad y sumad las potencias. Sin defensa, el Ataque tiene éxito, incluso con potencia 0. Con defensa, el Ataque debe superarla; el empate favorece al defensor."
  - pagina: 3
    tipo: "seccion"
    titulo: "Si el ataque tiene éxito"
    texto: "Si el objetivo es un gato, el atacante lo captura y elige Sofá o Salón; durante Huelga puede capturarlo, pero no moverlo hasta que termine el evento. Un ataque exitoso destruye la estructura objetivo: Caja de Cartón, Fortaleza Gatuna, Comedero Automático, Rascador de Sisal o Arenero. La Cama no puede elegirse como objetivo."
  - pagina: 3
    tipo: "seccion"
    titulo: "Apoyos y potencia"
    texto: "Los Apoyos se suman a una carta de Ataque o Defensa; no atacan ni defienden por sí solos y no hay límite por combate. Ataque en Manada cuenta tus gatos de ambas zonas. Manguerazo Frío cuenta los del defensor final después de los desvíos. El Rascador permite descartar 1 carta al declarar el ataque para sumar +1; decide antes de que el rival elija defensa."
  - pagina: 3
    tipo: "seccion"
    grupo: "turno-perdido"
    titulo: "Turno perdido"
    texto: "Con No te muevas, estoy cómodo pierdes el turno completo, incluidos inicio, cierre y comprobación de victoria. Varias copias antes de tu turno hacen perder un solo turno; los efectos que debían caducar al inicio esperan hasta el siguiente inicio que resuelvas."
  - pagina: 3
    tipo: "seccion"
    titulo: "Acciones adicionales"
    texto: "Cada acción extra permite jugar 1 carta o declarar 1 ataque durante la Fase de Acción; no estás obligado a gastarla. Puedes encadenar cartas que concedan acciones; las que sobren al cierre se pierden y nunca permiten mover."
  - pagina: 3
    tipo: "seccion"
    titulo: "Flús-Flús"
    texto: "Los Eventos individuales cancelables llevan la marca de Flús-Flús; Sabotaje Vecinal no se cancela y puede destruir cualquier estructura rival, incluida Fortaleza. Cualquier jugador puede responder, incluso a favor de otro. Un Flús-Flús puede cancelar otro y las cadenas se resuelven desde el último al primero. La acción gastada no se recupera. Ataques, Apoyos, estructuras, consumibles y Eventos Globales no se cancelan."
  - pagina: 4
    tipo: "encabezado"
    titulo: "Estructuras y eventos globales"
    columnas: 2
    texto: "Cada casa puede tener 1 estructura activa; si juegas otra, la anterior se descarta."
  - pagina: 4
    tipo: "lista"
    grupo: "estructuras"
    titulo: "Estructuras"
    ancho: "completo"
    texto: "Caja de Cartón protege tus gatos de ataques directos."
  - pagina: 4
    tipo: "lista"
    grupo: "estructuras"
    texto: "Fortaleza Gatuna protege tus gatos de ataques directos y bloquea Eventos individuales rivales que afecten a tus gatos, tu mano o tu Salón. Permanece tras interceptar un Evento; no protege otras estructuras ni tus propios Eventos."
  - pagina: 4
    tipo: "lista"
    grupo: "estructuras"
    texto: "Comedero Automático añade 1 carta al robo inicial. Su bonificación se acumula con la del Bebé si está solo en el Sofá."
  - pagina: 4
    tipo: "lista"
    grupo: "estructuras"
    texto: "Rascador: una vez por turno, al declarar un ataque, puedes descartar 1 carta para sumar +1 a su potencia."
  - pagina: 4
    tipo: "lista"
    grupo: "estructuras"
    texto: "Cama de Peluche queda junto al gato que protege; ese gato no puede ser atacado ni moverse. La Cama se descarta al inicio del siguiente turno de su dueño."
  - pagina: 4
    tipo: "lista"
    grupo: "estructuras"
    texto: "Arenero recibe boca arriba los descartes de tu mano, incluidos costes y descartes impuestos. Si sale de juego, las cartas que tenía van al descarte común."
  - pagina: 4
    tipo: "seccion"
    titulo: "Eventos Globales"
    texto: "Afectan a todos, también a quien los juega, y no se cancelan con Flús-Flús."
  - pagina: 4
    tipo: "lista"
    grupo: "eventos"
    titulo: "Efectos de los eventos"
    ancho: "completo"
    texto: "Hora de la Siesta desactiva habilidades y sinergias hasta tu próximo turno, pero no inmoviliza a los gatos y mantiene sus puntuaciones y los valores de Solitario. Anula la protección de Solitario."
  - pagina: 4
    tipo: "lista"
    grupo: "eventos"
    texto: "Perro del Vecino hace que cada jugador mueva 1 gato del Sofá al Salón si puede; la Cama impide mover al gato protegido."
  - pagina: 4
    tipo: "lista"
    grupo: "eventos"
    texto: "Reparto de Juguetes: todos pasan 1 carta boca abajo a la izquierda, simultáneamente. Quien no tenga carta puede recibir."
  - pagina: 4
    tipo: "lista"
    grupo: "eventos"
    texto: "Visita al Veterinario: con 1–3 gatos, descarta 1 carta; con 4 o más, descarta 2; con 0, no descartas."
  - pagina: 4
    tipo: "lista"
    grupo: "eventos"
    texto: "Huelga de Gatos impide mover gatos que ya están en una casa. Los gatos nuevos pueden entrar, pero no moverse hasta que acabe el evento. Se puede seguir atacando."
  - pagina: 5
    tipo: "encabezado"
    titulo: "Sinergias y consulta rápida"
    columnas: 3
    texto: "Salvo que una sinergia indique otra condición, sus gatos deben estar juntos en el Sofá."
  - pagina: 5
    tipo: "sinergia"
    titulo: "¡Que me aplastas!"
    texto: "Coloca al Desnutrido debajo del Gordo; no ocupa una plaza adicional."
  - pagina: 5
    tipo: "sinergia"
    titulo: "Veteranos del barrio"
    texto: "De Barrio + Territorial: se anulan sus bonificaciones individuales de potencia; la pareja obtiene +2 de prestigio en total."
  - pagina: 5
    tipo: "sinergia"
    titulo: "Socios de información"
    texto: "Cotilla + Curioso: Cotilla no descarta para mirar; Curioso mira 4 cartas en lugar de 3."
  - pagina: 5
    tipo: "sinergia"
    titulo: "Control de inventario"
    texto: "Previsor + Acaparadora: si tienes menos de 3 cartas después del robo inicial, repón hasta 5 en vez de hasta 4."
  - pagina: 5
    tipo: "sinergia"
    titulo: "Saqueadores envidiosos"
    texto: "Envidiosa + Mapache: al destruir una estructura rival con un ataque, puedes descartar 1 carta para añadir esa estructura del descarte a tu mano."
  - pagina: 5
    tipo: "sinergia"
    titulo: "Pareja yin-yang"
    texto: "Diurno + Nocturno: la pareja obtiene +1 de prestigio adicional en total."
  - pagina: 5
    tipo: "sinergia"
    titulo: "¿Por qué yo?"
    texto: "Victimista + Hiperactivo: si ambos empiezan tu turno en el Sofá y el Victimista baja al Salón ese turno, roba 1 carta. El Victimista no puede volver al Sofá ese turno."
  - pagina: 5
    tipo: "sinergia"
    titulo: "Los Trillizos"
    texto: "Con los tres en el Sofá, obtienes +2 de prestigio además de sus puntos base."
  - pagina: 5
    tipo: "sinergia"
    titulo: "El ojito derecho"
    texto: "El Bebé recibe +2 de prestigio de Mamá Gata en lugar de +1; los demás gatos de tu Sofá siguen recibiendo +1."
  - pagina: 5
    tipo: "seccion"
    ancho: "completo"
    titulo: "Solitario y Ronroneo"
    texto: "En el Sofá, Solitario vale 7 puntos si está solo y 0 si está acompañado; en el Salón vale 2. Cuando está solo, cancela los Eventos individuales cancelables que lo elijan directamente. Ronroneo se pierde si cualquiera de los dos gatos sale del Sofá antes de tu siguiente turno."
  - pagina: 5
    tipo: "seccion"
    ancho: "completo"
    titulo: "Mazo agotado"
    texto: "Si se agota el mazo, baraja los descartes para formar uno nuevo. Si tampoco quedan descartes, termina el robo."
  - pagina: 5
    tipo: "nota"
    ancho: "completo"
    titulo: "Reglas en prueba"
    texto: "Queda por decidir si el atacante original puede ser objetivo de un desvío de Ratón y responder con otro; si Cotilla revela al defensor o a toda la mesa; el orden de descarte del combate; la colocación de Gordo y Desnutrido durante la Siesta; y si un gato protegido obliga a atacar primero la Caja o la Fortaleza."
