nombre: "Reglamento"
slug: "reglamento"
cartas:
  - pagina: 1
    tipo: "encabezado"
    titulo: "Introducción y preparación"
    columnas: 2
    texto: "En ¡Ese gato es mío!, todos los vecinos del barrio sois unos auténticos esnobs y locos de los gatos. Ya tenéis muchos gastos en casa, pero todavía no os habéis puesto de acuerdo sobre quién tiene los mejores mininos.\n\nLa llegada de nuevos mininos callejeros desata una guerra de postureo, travesuras y robos de gatos. Tendrás que acomodar a tus favoritos en el Sofá, aprovechar sus habilidades y fastidiar los planes de tus vecinos hasta demostrar quién tiene la colonia de gatos más prestigiosa.\n\nLos puntos de prestigio representan la reputación de tu colonia en el barrio. Los gatos aportan puntos según estén en el Sofá o en el Salón. Sus habilidades, las sinergias y algunas cartas pueden aumentar esos puntos."
  - pagina: 1
    tipo: "seccion"
    titulo: "Objetivo"
    texto: "Gana quien alcance su objetivo durante su propio turno. Si ya lo cumples al empezar, resuelve primero los efectos de inicio y sus respuestas. Durante el turno, tras resolver por completo cada acción, habilidad, movimiento o efecto y sus respuestas, coloca los gatos recibidos y comprueba la victoria. Comprueba también cualquier cambio de prestigio al cierre. Llegar a la cifra durante el turno de otra persona no da la victoria."
  - pagina: 1
    tipo: "lista"
    grupo: "prestigio"
    titulo: "Prestigio necesario"
    texto: "2 jugadores: 15 puntos."
  - pagina: 1
    tipo: "lista"
    grupo: "prestigio"
    texto: "3 o 4 jugadores: 13 puntos."
  - pagina: 1
    tipo: "lista"
    grupo: "prestigio"
    texto: "5 jugadores: 12 puntos."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    titulo: "Preparación"
    ordenada: true
    texto: "Baraja el mazo y reparte 4 cartas a cada jugador."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    ordenada: true
    texto: "Si recibes 3 o más gatos, devuelve las 4 cartas, baraja y repite el reparto."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    ordenada: true
    texto: "Coloca tus gatos en el Sofá si caben o en el Salón; las demás cartas forman tu mano. Comprueba la capacidad después de colocarlos."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    ordenada: true
    texto: "Empieza quien tenga menos gatos. En caso de empate, quien obtuvo menos puntos en la partida anterior; si persiste o no hay registro, decididlo al azar."
  - pagina: 1
    tipo: "lista"
    grupo: "preparacion"
    ordenada: true
    texto: "Los turnos continúan en sentido horario."
  - pagina: 1
    tipo: "seccion"
    titulo: "Tu casa 🛋️🏠"
    texto: "El Sofá tiene 3 espacios y activa las habilidades que no indiquen otra zona; el Salón no tiene límite y sus gatos también cuentan para el prestigio. El Gordo cuenta como un gato, pero ocupa 2 espacios; el Desnutrido bajo el Gordo no ocupa espacio adicional. Al recibir un gato, incluso en el reparto inicial o fuera de tu turno, elige el Sofá si cabe o el Salón y comprueba la capacidad tras colocarlo. Puedes elegir el Salón aunque quepa en el Sofá. Puedes reordenar libremente los gatos dentro del Sofá o del Salón por estética; es solo colocación, no movimiento entre zonas, y también está permitido durante Huelga. Cada casa tiene 1 estructura activa."
  - pagina: 1
    tipo: "lista"
    grupo: "estructuras"
    titulo: "Estructuras 🛡️"
    ancho: "completo"
    texto: "Caja de Cartón protege a tus gatos de ataques directos, incluso si están en el Salón."
  - pagina: 1
    tipo: "lista"
    grupo: "estructuras"
    texto: "Fortaleza Gatuna protege a tus gatos de ataques directos, también si están en el Salón, como la Caja de Cartón. Bloquea Eventos individuales rivales que los afecten. No protege la mano ni otras estructuras. Permanece tras bloquear un Evento; un ataque exitoso contra la Fortaleza o Sabotaje Vecinal la destruye."
  - pagina: 1
    tipo: "lista"
    grupo: "estructuras"
    texto: "Comedero Automático añade 1 carta al robo inicial. Su bonificación se acumula con la del Bebé si está solo en el Sofá."
  - pagina: 1
    tipo: "lista"
    grupo: "estructuras"
    texto: "Rascador: antes de la Fase de Acción, una vez por turno, puedes descartar 1 carta; el primer ataque posterior de este turno recibe +1 de daño. Puedes pagar el descarte aunque no ataques o saltes la fase."
  - pagina: 1
    tipo: "lista"
    grupo: "estructuras"
    texto: "Coloca la Cama de Peluche en su sitio habitual; protege al gato del Sofá que quede más cerca. Puedes reordenar los gatos del Sofá para decidir quién queda más cerca, incluso durante Huelga; es solo colocación, no movimiento entre zonas. El protegido no puede ser atacado ni movido con efectos de juego. Sabotaje Vecinal puede destruir la Cama. Descártala al inicio del siguiente turno de su dueño."
  - pagina: 1
    tipo: "lista"
    grupo: "estructuras"
    texto: "Arenero recibe boca arriba los costes y descartes impuestos de tu mano, incluso fuera de tu turno. Sus cartas quedan fuera del descarte común hasta que salga de juego; entonces van todas al descarte común."
  - pagina: 1
    tipo: "lista"
