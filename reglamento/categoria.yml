    icono: "cartas/emojis/flush flush.png"
    texto: "**Flús-Flús:** marca las cartas que se pueden cancelar; no es un tipo de carta."
  - pagina: 2
    tipo: "encabezado"
    titulo: "El turno 🃏"
    columnas: 2
    texto: "Izquierda: resumen; derecha: detalle del mismo turno. La Fase de Acción aparece en ambas vistas, pero solo hay una por turno. En el detalle, Curioso, Trillizos e Hiperactivo se resuelven antes de entrar en la fase; decide si la omites antes de usar esas habilidades. Colores: inicio (azul), robo (morado), acción (ocre), movimiento (verde), cierre (gris), habilidades (turquesa) y alternativas (rojo)."
