    texto: "Esta es la única Fase de Acción del turno. Puedes omitirla completa; si actúas, empiezas con 1 acción principal: juega 1 carta o declara 1 ataque. Puedes terminar dejando acciones adicionales sin gastar."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "3"
    fase: "accion"
    marca: "opcional"
    alternativa: "fase-accion"
    titulo: "Gordo · si te saltas la fase"
    texto: "Si está en tu Sofá y decides saltarte tu fase de acción, mira en secreto la primera carta del mazo. Puedes dejarla arriba o ponerla en el fondo."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "4"
    fase: "movimiento"
    marca: "fase"
    titulo: "Movimiento gatuno · opcional"
    texto: "Opcional: sube 1 gato del Salón al Sofá, baja 1 del Sofá al Salón o intercambia 1 de cada zona de tu casa. Comprueba la capacidad tras resolver el movimiento. Huelga impide bajar gatos del Sofá al Salón e intercambiarlos de zona; la Cama impide mover al gato protegido. Puedes reordenar libremente los gatos dentro del Sofá o del Salón por estética, incluso durante Huelga y en otros momentos (menos al que esta con la cama de peluche); es solo colocación, no movimiento entre zonas."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "4.1"
    fase: "cierre"
    marca: "intermedio"
    titulo: "Antes del cierre · Arenero"
    texto: "Con 3 o más cartas encima, puedes recuperar 1 y enviar todas las demás al descarte común; si pasas, se quedan. Recibe costes y descartes impuestos de tu mano, incluso fuera de tu turno. Ataques, Defensas, Apoyos y respuestas jugados van al descarte común normal. Las cartas encima están fuera del descarte común hasta que el Arenero salga de juego; entonces van todas al descarte. Los descartes por exceso de mano ocurren después de esta ventana."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
    titulo_grupo: "Paso a paso · con habilidades y efectos"
    numero: "5"
    fase: "cierre"
    marca: "fase"
    titulo: "Cierre del turno"
    texto: "Descarta hasta tu límite: 7 cartas, o 9 con Acaparadora. Caducan los efectos del turno; si cambia tu prestigio, comprueba la victoria."
  - pagina: 2
    tipo: "seccion"
    grupo: "turno-perdido"
    titulo: "Turno perdido"
    texto: "Con No te muevas, estoy cómodo pierdes el turno completo, incluidos inicio, cierre y comprobación de victoria. Varias copias antes de tu turno hacen perder un solo turno; los efectos que debían caducar al inicio esperan hasta el siguiente inicio que resuelvas."
  - pagina: 2
    tipo: "seccion"
    titulo: "Acciones adicionales"
    texto: "El Rascador se resuelve antes de la Fase de Acción y puedes pagarlo aunque la omitas. Si ya jugaste una carta o declaraste un ataque, dejar acciones adicionales sin gastar no cuenta como saltársela y no activa la habilidad del Gordo. Las acciones no se guardan para otro turno ni permiten mover."
  - pagina: 3
    tipo: "encabezado"
    titulo: "Combate, acciones y eventos ⚔️🌍"
    columnas: 2
    texto: "Atacar cuesta 1 acción principal. El objetivo puede ser un gato o una estructura atacable."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    titulo: "Resolución del combate ⚔️"
    ordenada: true
    ancho: "completo"
    texto: "El atacante declara el objetivo y elige boca abajo su Ataque y los Apoyos que quiera."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    ordenada: true
    texto: "Quien recibe el ataque puede usar Ratón con Hierba Gatuna para desviarlo a otro objetivo válido de cualquier casa salvo la del atacante, respetando las protecciones. Se permiten desvíos sucesivos y se puede volver a elegir un objetivo que ya apareció en la cadena. La Cama no puede elegirse. Si cancelan un Ratón con Flús-Flús, se conserva el objetivo anterior."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    ordenada: true
    texto: "El propietario del objetivo final decide si defiende con una carta de Ataque y puede añadir tantos Apoyos como quiera."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    ordenada: true
    texto: "Después de elegir la defensa, Espía revela el Ataque y sus Apoyos a toda la mesa sin coste. Cotilla puede revelar lo mismo a toda la mesa si descarta 1 carta; Socios de información elimina ese coste."
  - pagina: 3
    tipo: "lista"
    grupo: "combate"
    ordenada: true
    texto: "Revelad y sumad los daños. Sin defensa, el Ataque tiene éxito, incluso con daño 0. Con defensa, el Ataque debe superarla; el empate favorece al defensor."
  - pagina: 3
    tipo: "seccion"
    titulo: "Si el ataque tiene éxito"
    texto: "Si el objetivo es un gato, el atacante lo captura y elige Sofá si cabe o Salón. Durante Huelga se puede seguir atacando y el gato capturado entra en su nueva casa; solo se impide bajar gatos que ya estaban en el Sofá al Salón o intercambiar zonas. Comprueba la capacidad tras colocarlo y la victoria después de completar la captura. Un ataque exitoso contra Caja de Cartón o Fortaleza Gatuna destruye esa estructura y termina ahí: capturar al gato protegido requiere otro ataque. Las demás estructuras atacables también se destruyen con un ataque exitoso; la Cama no puede elegirse como objetivo de ataque, pero Sabotaje Vecinal sí puede destruirla."
  - pagina: 3
    tipo: "seccion"
    titulo: "Apoyos y daños"
    texto: "Los Apoyos se suman a una carta de Ataque o Defensa; no atacan ni defienden por sí solos y no hay límite por combate. Ataque en Manada cuenta tus gatos de ambas zonas. Manguerazo Frío cuenta los del defensor final después de los desvíos. Antes de la Fase de Acción, puedes descartar 1 carta con el Rascador: tu primer ataque posterior de este turno recibe +1, nunca una Defensa. Puedes pagar el descarte aunque no ataques o saltes la fase."
  - pagina: 3
    tipo: "seccion"
    titulo: "Eventos Globales 🌍"
    texto: "Afectan a todos, también a quien los juega, y no se cancelan con Flús-Flús."
  - pagina: 3
    tipo: "lista"
    grupo: "eventos"
    titulo: "Efectos de los eventos"
    ancho: "completo"
    texto: "Hora de la Siesta desactiva habilidades y sinergias hasta tu próximo turno, pero no inmoviliza a los gatos y mantiene sus puntuaciones y los valores de Solitario. Anula la protección de Solitario. El Desnutrido permanece bajo el Gordo: esa colocación pasiva no se rompe durante la Siesta."
  - pagina: 3
    tipo: "lista"
    grupo: "eventos"
    texto: "Perro del Vecino hace que cada jugador mueva 1 gato del Sofá al Salón si puede; la Cama impide mover al gato protegido."
  - pagina: 3
    tipo: "lista"
    grupo: "eventos"
    texto: "Reparto de Juguetes: todos pasan 1 carta boca abajo a la izquierda, simultáneamente. Quien no tenga carta puede recibir."
  - pagina: 3
    tipo: "lista"
    grupo: "eventos"
    texto: "Visita al Veterinario: con 1–3 gatos, descarta 1 carta; con 4 o más, descarta 2; con 0, no descartas."
  - pagina: 3
    tipo: "lista"
    grupo: "eventos"
    texto: "Huelga de Gatos impide mover gatos del Sofá al Salón y viceversa. Sí permite atacar y robar o capturar gatos, que entran en su nueva casa. Puedes reordenar libremente los gatos dentro del Sofá o del Salón, incluso durante Huelga; es solo colocación por estética, no movimiento entre zonas."
  - pagina: 4
    tipo: "encabezado"
    titulo: "Sinergias y consulta rápida 🔗"
    columnas: 3
    texto: "Salvo que una sinergia indique otra condición, sus gatos deben estar juntos en el Sofá."
  - pagina: 4
    tipo: "sinergia"
    titulo: "¡Que me aplastas!"
    texto: "Coloca al Desnutrido debajo del Gordo; no ocupa una plaza adicional y permanece así durante la Siesta."
  - pagina: 4
    tipo: "sinergia"
    titulo: "Veteranos del barrio"
    texto: "De Barrio + Territorial: se anulan sus bonificaciones individuales de daño; la pareja obtiene +2 de prestigio en total."
  - pagina: 4
    tipo: "sinergia"
    titulo: "Socios de información"
    texto: "Cotilla + Curioso: Cotilla usa «¿Qué tramas?» sin descartar. Curioso mira 4 cartas con «A ver qué hay» en vez de 3 y conserva su coste."
  - pagina: 4
    tipo: "sinergia"
    titulo: "Control de inventario"
    texto: "Previsor + Acaparadora: si tienes menos de 3 cartas después del robo inicial, repón hasta 5 en vez de hasta 4."
  - pagina: 4
    tipo: "sinergia"
    titulo: "Saqueadores envidiosos"
    texto: "Envidiosa + Mapache: al destruir una estructura rival con un ataque, puedes descartar 1 carta para añadir esa estructura del descarte a tu mano."
  - pagina: 4
    tipo: "sinergia"
    titulo: "Pareja yin-yang"
    texto: "Diurno + Nocturno: la pareja obtiene +1 de prestigio adicional en total."
  - pagina: 4
    tipo: "sinergia"
    titulo: "¿Por qué yo?"
    texto: "Victimista + Hiperactivo: si ambos empiezan tu turno en el Sofá y el Victimista baja al Salón ese turno, roba 1 carta. El Victimista no puede volver al Sofá ese turno."
  - pagina: 4
    tipo: "sinergia"
    titulo: "Los Trillizos"
    texto: "Con los tres en el Sofá, obtienes +2 de prestigio además de sus puntos base."
  - pagina: 4
    tipo: "sinergia"
    titulo: "El ojito derecho"
    texto: "El Bebé recibe +3 de prestigio de Mamá Gata en lugar de +1; los demás gatos de tu Sofá siguen recibiendo +1."
  - pagina: 4
    tipo: "seccion"
    ancho: "completo"
    titulo: "Mazo agotado 🃏"
    texto: "Si se agota el mazo, baraja los descartes para formar uno nuevo. Si tampoco quedan descartes, termina el robo."
  - pagina: 4
    tipo: "seccion"
    ancho: "completo"
    titulo: "Orden de descarte en combate"
    texto: "Al terminar el combate, descarta en este orden: Ataque del atacante; sus Apoyos; Defensa del defensor (la carta de Ataque que usó para defenderse); sus Apoyos de defensa. Al final, descarta la carta usada para revelar o consultar el Ataque y cualquier carta pagada para hacerlo, como Espía de Ventana o el descarte de Cotilla."
  - pagina: 4
    tipo: "seccion"
    titulo: "Flús-Flús 💦"
    ancho: "completo"
    texto: "Solo se cancelan las cartas con la marca de Flús-Flús. Se juega como respuesta antes de que se resuelva la carta marcada; no gasta una acción principal, pero una carta cancelada no produce su efecto y no recuperas la acción ni los costes pagados. Cualquier jugador puede responder, incluso si la carta no le afecta directamente o para proteger la carta de otro. Un Flús-Flús puede cancelar otro y encadenarse. Sabotaje Vecinal no lleva la marca, no se puede cancelar y puede destruir estructuras rivales, incluida la Cama de Peluche y la Fortaleza Gatuna. No se cancelan Ataques ni Defensas, Apoyos, Estructuras, Consumibles ni Eventos Globales."
