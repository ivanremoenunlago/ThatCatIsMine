    texto: "Antes de la Fase de Acción, una vez por turno, sube 1 gato del Salón al Sofá, baja 1 del Sofá al Salón o intercambia 1 de cada zona de tu casa."
  - pagina: 2
    tipo: "paso_turno"
    grupo: "completo"
