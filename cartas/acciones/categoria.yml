cartas:
  - nombre: "No te muevas, estoy cómodo"
    imagen: "imagenes/no te muevas, estoy cómodo..png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "El rival pierde su próxima Fase de Acción: no puede jugar ni atacar, pero sí robar y hacer el movimiento habitual. Déjala en su zona como recordatorio."
  - nombre: "Destrucción de Sofá"
    imagen: "imagenes/destruccion de sofa.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Obtienes +1 punto hasta el final del turno y 1 acción principal adicional. Cualquier rival puede cancelarla."
  - nombre: "Sobredosis de Catnip"
    imagen: "imagenes/sobredosis de catnip.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Obtienes 2 acciones extra este turno; no da movimientos extra."
  - nombre: "Ronroneo"
    imagen: "imagenes/ronroneo.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Elige 2 gatos del Sofá y cúbrelos con esta carta. Si siguen allí al inicio de tu próximo turno, obtienen +1 punto cada uno ese turno. Luego, descártala."
  - nombre: "Gato en la Ventana"
    imagen: "imagenes/gatos espias.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Mira la mano completa de un rival elegido."
  - nombre: "Sorpresa en la Almohada"
    imagen: "imagenes/Sorpresa en la almohada.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Elige un rival y descarta al azar la mitad de las cartas de su mano, redondeando hacia abajo."
  - nombre: "Tirar Cosas de la Mesa"
    imagen: "imagenes/tirar cosas de la mesa.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Elige un rival que tenga 6 o más cartas en su mano y róbale 2 cartas al azar."
  - nombre: "Sentarse en el Teclado"
    imagen: "imagenes/gatosobre el teclado.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Elige un rival que tenga 4 o más cartas en su mano y róbale 1 carta al azar."
  - nombre: "Puerta Gatera"
    imagen: "imagenes/puerta gatera.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Intercambia 1 gato movible tuyo por 1 gato del Salón rival. No puedes elegir un gato con Cama de Peluche; Fortaleza Gatuna puede interceptar."
  - nombre: "Robo Felino"
    imagen: "imagenes/robo felino.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Roba 1 gato del Salón rival (no del Sofá ni protegido por Cama de Peluche) y llévalo a tu casa. Fortaleza Gatuna puede interceptar."
  - nombre: "Apuntar con Láser Infrarrojo"
    imagen: "imagenes/laser.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Mueve un gato tuyo o rival entre el Sofá y el Salón. Fortaleza Gatuna puede interceptar si afecta directamente a una casa."
  - nombre: "¡Pspspsps!"
    imagen: "imagenes/pspspspsp.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Mira las 4 primeras cartas: elige 1 gato y llévalo a tu casa. Pon las demás al fondo en el orden que quieras; si no hay gatos, pon las 4 al fondo."
  - nombre: "Reforma Desastrosa"
    imagen: "imagenes/refroma desastrosa - Sabotaje Vecinal.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Destruye una instalación rival, incluida Cama de Peluche; su gato permanece y recupera movilidad. Fortaleza puede interceptar, salvo si es el objetivo."
  - nombre: "Ovillo de Lana"
    imagen: "imagenes/ovillo de lana.png"
    tipo: "objeto"
    copias: 3
    marca_flush: true
    descripcion: "Recupera de descartes una carta que no sea gato y añádela a tu mano. Si cancelan el Ovillo, no recuperas nada."
  - nombre: "Ratón con Hierba Gatuna"
    imagen: "imagenes/raton con hierva gatera.png"
    tipo: "objeto"
    copias: 1
    descripcion: "Reacción sin coste y no cancelable: desvía a otro gato válido un ataque directo a uno de los tuyos. Su dueño decide la defensa; el ataque sigue."
  - nombre: "Flús-Flús de Agua"
    imagen: "imagenes/flus flus 1.png"
    tipo: "respuesta"
    copias: 1
    marca_flush: true
    paleta: "azul"
    version: 1
    descripcion: "Cancela una carta marcada CANCELABLE. No afecta ataques, apoyos, eventos globales, estructuras ni consumibles; tampoco se cancela a sí misma."
