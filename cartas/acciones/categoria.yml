cartas:
  - nombre: "No te muevas, estoy cómodo"
    imagen: "imagenes/no_te_muevas_estoy_comodo.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Pon esta carta en el Salón de un rival. Ese jugador pierde su próximo turno completo, incluidos inicio, cierre y comprobación de victoria."
  - nombre: "Destrucción de Sofá"
    imagen: "imagenes/destruccion_de_sofa.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Obtienes +1 de prestigio hasta el final del turno y 1 acción adicional."
  - nombre: "Sobredosis de Catnip"
    imagen: "imagenes/sobredosis_de_catnip.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Obtienes 2 acciones extra."
  - nombre: "Ronroneo"
    imagen: "imagenes/ronroneo.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Cubre 2 gatos de tu Sofá con esta carta. Si alguno sale del Sofá antes del inicio de tu próximo turno, descártala. Si ambos permanecen, al inicio de tu próximo turno cada uno obtiene +1 de prestigio durante ese turno. Después, descarta esta carta."
  - nombre: "Espía de Ventana"
    imagen: "imagenes/espia_de_ventana.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Cuando te ataquen, revela el Ataque y sus Apoyos a toda la mesa después de que el defensor elija su defensa."
  - nombre: "Sorpresa en la Almohada"
    imagen: "imagenes/sorpresa_en_la_almohada.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Elige un rival. Descarta al azar la mitad de sus cartas de mano, redondeando hacia abajo, con un mínimo de 1 si tiene cartas."
  - nombre: "Tirar Cosas de la Mesa"
    imagen: "imagenes/tirar_cosas_de_la_mesa.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Elige un rival que tenga 6 o más cartas en su mano y róbale 2 cartas al azar."
  - nombre: "Sentarse en el Teclado"
    imagen: "imagenes/sentarse_en_el_teclado.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Elige un rival que tenga 4 o más cartas en su mano y róbale 1 carta al azar."
  - nombre: "Puerta Gatera"
    imagen: "imagenes/puerta_gatera.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Intercambia 1 gato tuyo por 1 gato rival. Cada gato ocupa el puesto que deja el otro. Si el Gordo no cabe en el Sofá de destino, colócalo en el Salón de su nueva casa."
  - nombre: "Robo Felino"
    imagen: "imagenes/robo_felino.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Roba 1 gato del Salón rival (no del Sofá) y llévalo a tu casa."
  - nombre: "Láser Infrarrojo"
    imagen: "imagenes/laser_infrarrojo.png"
    tipo: "accion"
    copias: 2
    marca_flush: true
    descripcion: "Elige tu casa o la de un rival. Mueve o intercambia 1 gato entre el sofá y el salón."
  - nombre: "¡Pspspsps!"
    imagen: "imagenes/pspspsps.png"
    tipo: "accion"
    copias: 1
    marca_flush: true
    descripcion: "Busca desde arriba en el mazo hasta encontrar el primer gato. Colócalo en tu casa y baraja el mazo. Si no encuentras ningún gato, baraja y roba 1 carta."
  - nombre: "Sabotaje Vecinal"
    imagen: "imagenes/sabotaje_vecinal.png"
    tipo: "accion"
    copias: 2
    marca_flush: false
    descripcion: "Destruye 1 estructura rival, incluida la Fortaleza. No se puede cancelar con Flús-Flús."
  - nombre: "Ovillo de Lana"
    imagen: "imagenes/ovillo_de_lana.png"
    tipo: "objeto"
    copias: 3
    marca_flush: true
    descripcion: "Recupera una carta del descarte común y quedatela."
  - nombre: "Ratón con Hierba Gatuna"
    imagen: "imagenes/raton_con_hierba_gatuna.png"
    tipo: "objeto"
    copias: 2
    marca_flush: true
    descripcion: "Cuando te ataquen, puedes desviar el ataque hacia otro gato o estructura válida de cualquier casa salvo la del atacante. El nuevo objetivo puede volver a desviarlo."
  - nombre: "Hora de la Siesta"
    imagen: "imagenes/hora_de_la_siesta.png"
    tipo: "evento_global"
    copias: 1
    descripcion: "Hasta el inicio de tu próximo turno, se anulan las habilidades y sinergias de todos los gatos."
  - nombre: "Perro del Vecino"
    imagen: "imagenes/perro_del_vecino.png"
    tipo: "evento_global"
    copias: 1
    descripcion: "Cada jugador baja 1 gato de su Sofá a su Salón, si puede."
  - nombre: "Reparto de Juguetes"
    imagen: "imagenes/reparto_de_juguetes.png"
    tipo: "evento_global"
    copias: 1
    descripcion: "Cada jugador pasa 1 carta de su mano, boca abajo, al jugador de su izquierda. Todos a la vez."
  - nombre: "Visita al Veterinario"
    imagen: "imagenes/visita_al_veterinario.png"
    tipo: "evento_global"
    copias: 1
    descripcion: "Cada jugador con 1 a 3 gatos descarta 1 carta. Con 4 o más gatos, descarta 2."
  - nombre: "Huelga de Gatos"
    imagen: "imagenes/huelga_de_gatos.png"
    tipo: "evento_global"
    copias: 1
    descripcion: "Hasta el inicio de tu próximo turno, no puedes mover gatos del Sofá al Salón ni viceversa. Sí puedes atacar y robar. Los gatos nuevos, incluidos los robados o capturados, pueden entrar en su nueva casa."
  - nombre: "Flús-Flús de Agua"
    imagen: "imagenes/flus-flus_de_agua_1.png"
    tipo: "respuesta"
    copias: 1
    marca_flush: true
    paleta: "azul"
    version: 1
    descripcion: "Cancela 1 carta marcada con el símbolo de Flús-Flús."
  - nombre: "Flús-Flús de Agua"
    imagen: "imagenes/flus-flus_de_agua_2.png"
    tipo: "respuesta"
    copias: 1
    marca_flush: true
    paleta: "azul"
    version: 2
    descripcion: "Cancela 1 carta marcada con el símbolo de Flús-Flús."
  - nombre: "Flús-Flús de Agua"
    imagen: "imagenes/flus-flus_de_agua_3.png"
    tipo: "respuesta"
    copias: 1
    marca_flush: true
    paleta: "azul"
    version: 3
    descripcion: "Cancela 1 carta marcada con el símbolo de Flús-Flús."
  - nombre: "Flús-Flús de Agua"
    imagen: "imagenes/flus-flus_de_agua_4.png"
    tipo: "respuesta"
    copias: 1
    marca_flush: true
    paleta: "azul"
    version: 4
    descripcion: "Cancela 1 carta marcada con el símbolo de Flús-Flús."
