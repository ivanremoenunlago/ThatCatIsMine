    version: 3
    descripcion: "Cancela una carta que lleve el indicador CANCELABLE. No puede cancelar ataques, apoyos, eventos globales, estructuras, consumibles ni cartas que no tengan ese indicador. Tampoco puede cancelarse a sí misma."
  - nombre: "Flús-Flús de Agua"
