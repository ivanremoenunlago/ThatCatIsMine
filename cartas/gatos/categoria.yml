    imagen: "imagenes/gato ncoturno.png"
    sofa: 3
    salon: 1
    descripcion: "Si un rival fracasa al atacar a uno de tus gatos del Sofá, se descarta una carta de su mano."
    sinergia: "Gato Diurno (Blanco) — Pareja yin-yang"
  - nombre: "Gato Trillizo"
    imagen: "imagenes/trillizo 1.png"
