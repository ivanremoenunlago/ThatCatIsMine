    imagen: "imagenes/mama gata.png"
    sofa: 2
    salon: 1
    descripcion: "Mientras esté activa en el Sofá, concede +1 punto de prestigio  a cada otro gato que esté en el Sofá."
  - nombre: "Gato Bebé"
    imagen: "imagenes/gato bebe.png"
    sofa: 1
    salon: 1
    descripcion: "Si está solo en el Sofá, durante el robo inicial roba 1 carta adicional."
  - nombre: "Gato Diurno (Blanco)"
    imagen: "imagenes/gato diurno.png"
    sofa: 3
    salon: 1
    descripcion: "Si un rival ataca con éxito a uno de tus gatos del Sofá, se descarta una carta de su mano."
    sinergia: "Gato Nocturno (Negro) — Pareja yin-yang"
