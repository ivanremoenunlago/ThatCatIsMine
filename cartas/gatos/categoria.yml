    imagen: "imagenes/gato territorial.png"
    sofa: 2
    salon: 1
    descripcion: "Aumenta en +1 el daño cuando te defiendes"
    sinergia: "Gato de Barrio (Matón) — Veteranos del barrio"
  - nombre: "Gato Cotilla"
    imagen: "imagenes/gato cotilla.png"
    sofa: 3
    salon: 1
