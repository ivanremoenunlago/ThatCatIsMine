    salon: 1
    descripcion: "Una vez por turno, descarta y roba tantas cartas como Trillizos tengas en el Sofá."
    sinergia: "Los otros 2 Trillizos — Los Trillizos"
  - nombre: "Gato Trillizo"
    imagen: "imagenes/trillizo 3.png"
    sofa: 2
    salon: 1
    descripcion: "Una vez por turno, descarta y roba tantas cartas como Trillizos tengas en el Sofá."
    sinergia: "Los otros 2 Trillizos — Los Trillizos"
  - nombre: "Gato Solitario"
    imagen: "imagenes/gato solitario.png"
    sofa: 0/7
    salon: 2
    descripcion: "Si es el único gato en el Sofá, cancela automáticamente cartas CANCELABLES que lo elijan como objetivo y da 7 de presitigio. Si esta acompañado pierde su inmunidad y da 0 de prestigio."
  - nombre: "Gato Escalador"
    imagen: "imagenes/gato escalador.png"
    sofa: 3
    salon: 1
    descripcion: "Una vez por turno, puedes realizar un movimiento gatuno adicional durante el Paso de Preparación."
    sinergia: "Gato Victimista — ¡Porque solo a mí!"
  - nombre: "Gato Mapache"
    imagen: "imagenes/mapache.png"
    sofa: 2
    salon: 1
    descripcion: "Puedes recuperar la última carta de la pila de descartes en lugar de tu robo inicial."
    sinergia: "Gata Envidiosa — Saqueadores envidiosos"
  - nombre: "Gato Victimista"
    imagen: "imagenes/gato victimista.png"
    sofa: 3
    salon: 1
    descripcion: "Si cancelan con Flús-Flús de Agua una travesura tuya, el rival descarta 1 carta adicional."
    sinergia: "Gato Escalador — ¡Porque solo a mí!"
