    sinergia: "Gato Curioso — Socios de información"
  - nombre: "Gato Curioso"
    imagen: "imagenes/gato curioso.png"
    sofa: 3
    salon: 1
    descripcion: "Al inicio de tu fase de robo, puedes descartar 1 carta para mirar las 3 primeras del mazo y quedarte con 1."
    sinergia: "Gato Cotilla — Socios de información"
  - nombre: "Gato Metódico"
    imagen: "imagenes/gato metodico.png"
    sofa: 3
    salon: 1
    descripcion: "Si al final de la fase de robo tienes menos de 3 cartas, roba hasta tener 4."
    sinergia: "Gato Acaparador — Control de inventario"
  - nombre: "Gato Acaparador"
    imagen: "imagenes/gato acaparador.png"
    sofa: 3
    salon: 1
    descripcion: "Aumenta tu límite de mano de 7 a 9 cartas."
    sinergia: "Gato Metódico — Control de inventario"
  - nombre: "Gata Envidiosa"
    imagen: "imagenes/gato envidioso.png"
    sofa: 4
    salon: 2
    descripcion: "Tus ataques contra instalaciones reciben +1 de daño. No se aplica contra gatos."
    sinergia: "Gato Mapache — Saqueadores envidiosos"
