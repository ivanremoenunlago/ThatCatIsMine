cartas:
  - nombre: "Hora de la Siesta"
    imagen: "imagenes/hora de la siesta.png"
    tipo: "evento_global"
    copias: 1
    descripcion: "Hasta el inicio de tu siguiente turno, todos los gatos, incluido el tuyo, quedan dormidos: sus habilidades y sinergias quedan desactivadas, pero sus valores base siguen contando. El Gato Solitario conserva su puntuación condicional (7 puntos si está solo en el Sofá; 0 si está acompañado), pero pierde su inmunidad. La pareja Gato Gordo–Gato Desnutrido mantiene su colocación, sin otras bonificaciones. El movimiento habitual y los efectos de cartas que muevan gatos siguen permitidos."
  - nombre: "Perro del Vecino"
    imagen: "imagenes/perro del vecino.png"
    tipo: "evento_global"
    copias: 1
    descripcion: "Cada jugador debe elegir 1 gato movible de su Sofá y enviarlo al Salón. Los gatos protegidos por Cama de Peluche no pueden moverse. Si no tiene gatos movibles en su Sofá, no mueve ninguno. No puede cancelarse con respuestas normales y Fortaleza Gatuna no lo detiene."
