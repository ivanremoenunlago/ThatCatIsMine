cartas:
  - nombre: "Caja de Cartón"
    imagen: "imagenes/caja de cartón.png"
    tipo: "estructura"
    copias: 2
    descripcion: "Estructura defensiva de un solo uso. Protege a todos tus gatos, tanto en el Sofá como en el Salón, y a tus instalaciones de apoyo. Mientras esté activa, estos objetivos no pueden elegirse directamente como objetivo de un ataque. Para acceder a ellos, primero debe destruirse o retirarse la Caja: puede destruirse mediante un ataque exitoso contra ella o mediante un efecto que permita destruir instalaciones. Los objetivos protegidos permanecen intactos. No detiene travesuras ni eventos globales."
  - nombre: "Fortaleza Gatuna"
    imagen: "imagenes/torre rascador.png"
    tipo: "estructura"
    copias: 1
    descripcion: "Estructura defensiva. Protege a todos los gatos y las instalaciones de tu casa. Mientras esté activa, estos objetivos no pueden elegirse directamente como objetivo de un ataque. Para acceder a ellos, primero debe destruirse la Fortaleza mediante un ataque exitoso contra ella o mediante Reforma Desastrosa. Además, intercepta las acciones o travesuras hostiles dirigidas contra tu casa, tus gatos o tus instalaciones. Si intercepta una acción o travesura que no sea un ataque, no se destruye y puede seguir protegiendo mientras permanezca activa. No detiene eventos globales."
  - nombre: "Comedero Automático"
    imagen: "imagenes/comedero automático.png"
    tipo: "estructura"
    copias: 2
    descripcion: "Mientras esté activo, robas 2 cartas en lugar de 1 durante tu robo inicial. Varios Comederos no acumulan el efecto. Puede destruirse mediante un ataque exitoso contra instalaciones o con Reforma Desastrosa."
  - nombre: "Rascador de Sisal"
    imagen: "imagenes/rascador.png"
    tipo: "estructura"
    copias: 1
    descripcion: "Una vez durante tu turno, en el Paso de Preparación, puedes descartar 2 cartas de tu mano. Si lo haces, tu primer ataque de ese turno obtiene +1 de potencia."
  - nombre: "Cama de Peluche"
    imagen: "imagenes/cama de peluche.png"
    tipo: "estructura"
    copias: 1
    descripcion: "Se coloca sobre un gato de tu casa y cuenta como estructura. Protege exclusivamente a ese gato. Mientras tenga la Cama encima, no puede elegirse como objetivo de un ataque directo ni ser robado, intercambiado o desplazado por ningún efecto. El gato queda inmovilizado en su zona. La Cama se descarta al comienzo del siguiente turno de su propietario, antes de resolver los efectos de inicio. El gato permanece en su zona y recupera su movilidad. La Cama también puede destruirse mediante un ataque exitoso contra ella como instalación o mediante Reforma Desastrosa."
