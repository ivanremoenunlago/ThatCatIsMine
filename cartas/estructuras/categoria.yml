    descripcion: "Protege a tus gatos de ataques directos. Un ataque con éxito contra la Caja la destruye."
  - nombre: "Fortaleza Gatuna"
    imagen: "imagenes/fortaleza_gatuna.png"
    tipo: "estructura"
    copias: 1
    descripcion: "Protege a tus gatos de ataques directos. Bloquea los Eventos individuales rivales que los afecten. Un ataque con éxito contra la Fortaleza la destruyen."
  - nombre: "Comedero Automático"
    imagen: "imagenes/comedero_automatico.png"
    tipo: "estructura"
    copias: 2
    descripcion: "Roba 1 carta más en tu robo inicial. Un ataque con éxito contra el Comedero lo destruye."
  - nombre: "Rascador de Sisal"
    imagen: "imagenes/rascador_de_sisal.png"
    tipo: "estructura"
    copias: 1
    descripcion: "Antes de la Fase de Acción, puedes descartar 1 carta. Tu primer ataque posterior de este turno recibe +1 de potencia, nunca una Defensa. Un ataque con éxito contra el Rascador lo destruye."
  - nombre: "Cama de Peluche"
    imagen: "imagenes/cama_de_peluche.png"
    tipo: "estructura"
    copias: 1
    descripcion: "Pon la Cama en su sitio habitual; protege al gato del Sofá que quede más cerca. (Puedes reordenar los gatos del Sofá). Sabotaje Vecinal puede destruirla. Descarta la Cama al inicio de tu próximo turno."
  - nombre: "Arenero"
    imagen: "imagenes/arenero.png"
    tipo: "estructura"
    copias: 1
    descripcion: "Pon aquí boca arriba las cartas que descartes de tu mano. Justo antes del cierre, si hay 3 o más, puedes recuperar 1 y mandar el resto al descarte común. Un ataque con éxito contra el Arenero lo destruye. Si sale de juego, vacíalo en el descarte común."