cartas:
  - nombre: "¡Que me aplastas!"
    descripcion: "Gordo + Desnutrido: coloca al Desnutrido bajo el Gordo; no ocupa espacio adicional."
    imagen: "que_me_aplastas.png"
  - nombre: "Veteranos del barrio"
    descripcion: "Matón + Territorial: se anulan sus bonificaciones individuales; la pareja obtiene +2 prestigio en total."
    imagen: "veteranos_del_barrio.png"
  - nombre: "Socios de información"
    descripcion: "Cotilla + Curioso: Cotilla no descarta para mirar; Curioso mira 4 cartas en lugar de 3."
    imagen: "socios_de_informacion.png"
  - nombre: "Control de inventario"
    descripcion: "Metódico + Acaparador: si acabas el robo con menos de 3 cartas, repón hasta 5. Sustituye el objetivo de Metódico."
    imagen: "control_de_inventario.png"
  - nombre: "Saqueadores envidiosos"
    descripcion: "Envidiosa + Mapache: al destruir una estructura rival con un ataque, puedes descartar 1 carta para recuperar esa estructura del descarte."
    imagen: "saqueadores_envidiosos.png"
  - nombre: "Pareja yin-yang"
    descripcion: "Diurno + Nocturno: la pareja obtiene +1 prestigio adicional en total."
    imagen: "pareja_yin-yang.png"
  - nombre: "¡Porque solo a mí!"
    descripcion: "Victimista + Escalador: si ambos están en el Sofá al inicio y Victimista sale durante tu turno, roba 1 carta. No puede volver al Sofá ese turno."
    imagen: "porque_solo_a_mi.png"
  - nombre: "Los Trillizos"
    descripcion: "Con los tres en el Sofá, obtienes +2 prestigio además de sus puntos base."
    imagen: "los_trillizos.png"
  - nombre: "Mamá y Bebé"
    descripcion: "Mamá Gata + Gato Bebé: si ambos están en el Sofá, el Bebé recibe +2 de prestigio por la habilidad de Mamá Gata en lugar de +1; los demás gatos siguen recibiendo +1."
    imagen: "mama_y_bebe.png"
