nombre: "Sinergias"
slug: "sinergias"
paleta:
  marco: "#C58A2E"
  fondo: "#F5E9CE"
  papel: "#FFF8E9"
  tinta: "#493323"
  detalle: "#B98232"
diseno:
  ancho_mm: 63.5
  alto_mm: 88
  dpi: 720
  dpi_vista_previa: 240
cartas:
  - nombre: "¡Que me aplastas!"
    descripcion: "El Gordo se sienta sobre el desnutrido. El Desnutrido no ocupa una plaza adicional."
    lore: "El Desnutrido se sentó primero. El Gordo ni lo vio."
    gatos: ["Gato Gordo", "Gato Desnutrido"]
    imagen: "que_me_aplastas.png"
  - nombre: "Veteranos del barrio"
    descripcion: "Se anulan sus bonificaciones individuales de daño y la pareja obtiene +2 de prestigio en total."
    lore: "Los dos saben pelear. Juntos, se pasan el día peleándose entre ellos."
    gatos: ["Gato de Barrio", "Gato Territorial"]
    imagen: "veteranos_del_barrio.png"
  - nombre: "Socios de información"
    descripcion: "El Cotilla puede usar «¿Qué tramas?» sin descartar. Curioso mira 4 cartas en vez de 3 al usar «A ver qué hay»; conserva su coste de descarte."
    lore: "El Curioso mete el hocico. El Cotilla se entera de todo lo demás."
    gatos: ["Gato Cotilla", "Gato Curioso"]
    imagen: "socios_de_informacion.png"
  - nombre: "Control de inventario"
    descripcion: "Si tienes menos de 3 cartas después del robo inicial, repón hasta 5 en vez de hasta 4."
    lore: "«¿Una más?», dice el Previsor. «Aquí cabe», dice la Acaparadora."
    gatos: ["Gato Previsor", "Gata Acaparadora"]
    imagen: "control_de_inventario.png"
  - nombre: "Saqueadores envidiosos"
    descripcion: "Si destruyes una estructura rival con un ataque, puedes descartar 1 carta para añadir esa estructura del descarte a tu mano."
    lore: "Ella derriba lo que quiere. Él se lo lleva en cuanto cae."
    gatos: ["Gata Envidiosa", "Gato Mapache"]
    imagen: "saqueadores_envidiosos.png"
  - nombre: "Pareja yin-yang"
    descripcion: "La pareja obtiene +1 de prestigio adicional en total."
    lore: "El blanco te hace pagar si aciertas. El negro, si fallas."
    gatos: ["Gato Diurno", "Gato Nocturno"]
    imagen: "pareja_yin-yang.png"
  - nombre: "¿Por qué yo?"
    descripcion: "Si ambos empiezan tu turno en el Sofá y el Victimista baja al Salón ese turno, roba 1 carta. El Victimista no puede volver al Sofá ese turno."
    lore: "El Hiperactivo revolvió todo el sofá. Adivina quién acabó en el suelo."
    gatos: ["Gato Victimista", "Gato Hiperactivo"]
    imagen: "porque_solo_a_mi.png"
  - nombre: "Los Trillizos"
    descripcion: "Si los tres están en el Sofá, obtienes +2 de prestigio en total, además de sus puntos base."
    lore: "Con uno ya hay lío. Con los tres, ni sabes quién empezó."
    gatos: ["Gato Trillizo", "Gato Trillizo", "Gato Trillizo"]
    imagen: "los_trillizos.png"
  - nombre: "El ojito derecho"
    descripcion: "El Bebé recibe +3 de prestigio de Mamá Gata en lugar de +1. Los demás gatos de tu Sofá siguen recibiendo +1."
    lore: "Hay mimos para todos. Y uno más para el pequeño."
    gatos: ["Mamá Gata", "Gato Bebé"]
    imagen: "mama_y_bebe.png"
